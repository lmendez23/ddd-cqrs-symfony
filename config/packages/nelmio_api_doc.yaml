nelmio_api_doc:
    documentation:
        info:
            title: Dragon Ball API
            description: REST API for Dragon Ball universe characters and planets
            version: 1.0.0
        servers:
            - url: http://localhost:8060/api/v1
              description: Development server
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - Bearer: []
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
