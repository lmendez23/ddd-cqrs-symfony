# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Command and Query Bus configuration
    App\Shared\Domain\Contracts\CommandBusInterface:
        alias: App\Shared\Infrastructure\Symfony\Bus\CommandBus

    App\Shared\Domain\Contracts\QueryBusInterface:
        alias: App\Shared\Infrastructure\Symfony\Bus\QueryBus

    App\Shared\Infrastructure\Symfony\Bus\CommandBus:
        arguments:
            $commandBus: '@command.bus'

    App\Shared\Infrastructure\Symfony\Bus\QueryBus:
        arguments:
            $queryBus: '@query.bus'

    # Password hasher service
    App\Shared\Domain\Contracts\PasswordHasherInterface:
        alias: App\Shared\Infrastructure\Symfony\Security\PasswordHasher

    # Exception listener
    App\Shared\Infrastructure\Symfony\Exception\ExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    # Rate limiting middleware
    App\Shared\Infrastructure\Symfony\Http\RateLimitMiddleware:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 10 }

    # Input validation middleware
    App\Shared\Infrastructure\Symfony\Http\ValidationMiddleware:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 20 }
